workflows:
  android-apk:
    name: Gestao de Imoveis - APK
    instance_type: linux_x2
    max_build_duration: 30
    scripts:
      - name: Extrair projeto Android
        script: |
          rm -rf build_project
          mkdir -p build_project
          unzip -q Gestao_de_Imoveis_Android.zip -d build_project
      - name: Compilar APK de release
        script: |
          cd build_project/gestao_android
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          rm -rf /tmp/gradle-8.7
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleRelease
    artifacts:
      - build_project/gestao_android/app/build/outputs/apk/release/*.apk
